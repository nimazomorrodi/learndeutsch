name: Deploy Lernhaus
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lernhaus-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: runner-only
          MARIADB_DATABASE: lernhaus_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Check PHP, JavaScript and repeatable database installation
        env:
          LERNHAUS_DB_DSN: 'mysql:host=127.0.0.1;dbname=lernhaus_test;charset=utf8mb4'
          LERNHAUS_DB_USER: root
          LERNHAUS_DB_PASSWORD: runner-only
        run: |
          find app bin dist -name '*.php' -print0 | xargs -0 -n1 php -l
          for script in dist/*.js; do node --check "$script"; done
          php bin/migrate.php
          php bin/migrate.php
          php -r 'require "app/database.php"; $pdo=db(); if (!$pdo->query("SELECT COUNT(*) FROM lessons")->fetchColumn()) exit(1);'
          bash -n bin/deploy-host.sh && bash -n bin/deploy-runner.sh

  check-ssh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Check SSH authentication and document root
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_WEBROOT: ${{ vars.DEPLOY_WEBROOT }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash bin/deploy-runner.sh --check

  pronunciation:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        language: [de, fa]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Restore rendered pronunciation files
        id: clips
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/assets/audio/leitner/v1/${{ matrix.language }}
          key: clips-v1-${{ matrix.language }}-${{ matrix.shard }}-${{ hashFiles('database/curriculum.json') }}
          restore-keys: clips-v1-${{ matrix.language }}-${{ matrix.shard }}-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.clips.outputs.cache-hit != 'true'
        with: {python-version: '3.11'}
      - name: Generate missing MP3s
        if: steps.clips.outputs.cache-hit != 'true'
        env:
          LANG_CODE: ${{ matrix.language }}
          SHARD: ${{ matrix.shard }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          python -m pip install 'supertonic==1.3.1' 'piper-tts==1.8.0'
          if [[ "$LANG_CODE" == de ]]; then
            python -c 'from huggingface_hub import snapshot_download; snapshot_download("Supertone/supertonic-3", revision="3cadd1ee6394adea1bd021217a0e650ede09a323", allow_patterns=["onnx/*", "voice_styles/*.json"], local_dir=".local/supertonic-3")'
          else
            mkdir -p .local/piper
            for file in fa_IR-amir-medium.onnx fa_IR-amir-medium.onnx.json; do
              curl -fLsS --retry 3 "https://huggingface.co/rhasspy/piper-voices/resolve/e5349433ed883a32f893a434dc43a6c66b95ef7c/fa/fa_IR/amir/medium/$file?download=true" -o ".local/piper/$file"
            done
          fi
          python bin/generate-audio.py --deck "$LANG_CODE" --shard "$SHARD"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clips-${{ matrix.language }}-${{ matrix.shard }}
          path: dist/assets/audio/leitner/v1/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [check-ssh, pronunciation]
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://learn.nimazomorrodi.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: clips-*
          path: dist/assets/audio/leitner/v1
          merge-multiple: true
      - name: Verify audio coverage
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          for lesson in json.loads(Path("database/curriculum.json").read_text())["lessons"]:
              for word in lesson["words"]:
                  pair = next(p for p in lesson["examples"][word[0]] if all(p))
                  for col, lang in enumerate(("de", "fa")):
                      for text in (word[col], pair[col]):
                          name = hashlib.sha256(text.encode()).hexdigest()
                          if not Path(f"dist/assets/audio/leitner/v1/{lang}/{name}.mp3").stat().st_size:
                              raise ValueError(f"Empty audio for {text}")
          PY
      - name: Publish release over SSH and verify public HTTPS
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_WEBROOT: ${{ vars.DEPLOY_WEBROOT }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME || secrets.DB_NAME }}
          DB_USER: ${{ vars.DB_USER || secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || secrets.DB_PASS }}
        run: bash bin/deploy-runner.sh
